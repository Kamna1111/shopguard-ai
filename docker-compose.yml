services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopguard
      POSTGRES_USER: shopguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopguard-local-only}
    volumes:
      - shopguard-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopguard -d shopguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://shopguard:${POSTGRES_PASSWORD:-shopguard-local-only}@db:5432/shopguard
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-change-me}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        alembic -c apps/api/alembic.ini upgrade head
        && python -m app.seed
        && uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./outputs/test-results:/app/outputs/test-results
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  shopguard-db:
